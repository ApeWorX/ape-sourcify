repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --group lint ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --group lint ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked --group lint mypy ape_sourcify
        language: system
        pass_filenames: false
        types: [python]
      - id: mdformat
        name: mdformat
        entry: uv run --locked --group lint mdformat
        language: system
        types: [markdown]
