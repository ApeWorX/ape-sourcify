[build-system]
requires = ["setuptools>=75.6.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ape-sourcify"
dynamic = ["version"]
description = "Sourcify explorer and source-verification plugin for Ape"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
authors = [
    { name = "ApeWorX Ltd.", email = "admin@apeworx.io" },
]
keywords = ["ape", "ethereum", "explorer", "sourcify", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "eth-ape>=0.8.50,<0.9",
    "ethpm-types>=0.6.28,<0.7",
    "evmchains>=0.1,<0.2",
    "hexbytes>=1.2,<2",
    "pydantic>=2.10,<3",
    "requests>=2.28.1,<3",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/ape-sourcify"
Repository = "https://github.com/ApeWorX/ape-sourcify"
Issues = "https://github.com/ApeWorX/ape-sourcify/issues"
Documentation = "https://github.com/ApeWorX/ape-sourcify#readme"
"Sourcify API" = "https://docs.sourcify.dev/docs/api/"

[dependency-groups]
test = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-mock>=3.14,<4",
]
lint = [
    "mypy>=1.16,<2",
    "ruff>=0.12",
    "types-requests",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
release = [
    "twine>=6,<7",
]
dev = [
    "build>=1.2,<2",
    "commitlint",
    "pre-commit",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "release" },
]

[tool.setuptools]
include-package-data = true
packages = ["ape_sourcify"]
package-data = { "ape_sourcify" = ["py.typed"] }

[tool.setuptools_scm]
fallback_version = "0.1.0"
write_to = "ape_sourcify/version.py"

[tool.pytest.ini_options]
addopts = """
    -p no:ape_test
    -m "not live"
    --cov-branch
    --cov-report term-missing
    --cov=ape_sourcify
"""
testpaths = ["tests"]
markers = [
    "live: tests that call the production Sourcify API",
]

[tool.coverage.run]
omit = ["ape_sourcify/version.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["ape_sourcify/version.py"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RET", "SIM", "UP", "W"]
ignore = ["E501", "RET501", "RET502", "RET503", "RET504", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ape_sourcify"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
exclude = ["build", "dist"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.mdformat]
number = true
