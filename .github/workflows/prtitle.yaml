name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v7
      - run: uvx commitlint -- "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
